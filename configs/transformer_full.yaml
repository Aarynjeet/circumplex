# Full fine-tuning of roberta-base (all ~125M parameters trainable).
# RoBERTa rather than DeBERTa-v3: DeBERTa-v3 has known fp16 overflow issues on T4.
base: base.yaml
name: roberta_full
model:
  type: transformer
  name: roberta-base
  dropout: 0.1
train:
  epochs: 4
  batch_size: 32
  grad_accum_steps: 1
  lr: 3.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.1
  max_grad_norm: 1.0
  amp: true
  patience: 2
  evals_per_epoch: 2
  num_workers: 2
