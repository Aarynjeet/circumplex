name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install (CPU-only torch to keep the runner small)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Lint
        run: |
          ruff check src tests scripts demo notebooks
          ruff format --check src tests scripts demo

      - name: Cache GoEmotions download
        uses: actions/cache@v4
        with:
          path: data/cache
          key: goemotions-v1

      - name: Unit tests
        run: python -m pytest

      - name: CPU smoke test (all training paths)
        run: make smoke
